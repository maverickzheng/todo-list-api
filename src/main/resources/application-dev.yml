spring:

    # H2 Database Configuration
    # http://localhost:8080/h2-console
    h2:
        console:
            enabled: true
            path: /h2-console


    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:note
        username: sa
        password:

    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true