# Driver 的類別路徑
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 資料庫地址
spring.datasource.url=jdbc:mysql://localhost:3306/database?serverTimezone=Asia/Taipei&characterEncoding=utf-8

# 資料庫帳密
spring.datasource.username=root
spring.datasource.password=admin

# 啟動 server 時，要如何配置資料表；create 是基於測試用途，限於開發或測試環境
spring.jpa.hibernate.ddl-auto=create